<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Nunito:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6FA;
    --surface:#FFFFFF;
    --surface-2:#EFF1F5;
    --surface-3:#E3E6ED;
    --text:#14161D;
    --text-soft:#5B6273;
    --line:#E1E3EA;
    --accent:#4C74E8;
    --accent-dark:#3559C4;
    --ok:#3FAE72;
    --danger:#E24C3F;
    --white:#FFFFFF;
    --header-bg:#181B24;
    --header-text:#F4F5F9;
    --header-text-soft:#9AA1B4;
    --radius:14px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  a{color:inherit;}

  /* ---------- Encabezado ---------- */
  header.topbar{
    background:var(--header-bg);
    color:var(--header-text);
    padding:16px 20px;
    display:flex;
    align-items:center;
    gap:14px;
    position:sticky;
    top:0;
    z-index:20;
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .logo-wrap{
    height:42px;width:auto;max-width:190px;
    display:flex;align-items:center;justify-content:flex-start;
    flex-shrink:0;overflow:hidden;
  }
  .logo-wrap img{height:100%;width:auto;object-fit:contain;display:block;}
  .logo-wrap:empty{
    width:42px;height:42px;border-radius:10px;background:var(--accent);
    font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--white);
    display:flex;align-items:center;justify-content:center;
  }
  .brand-name{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:.2px;color:var(--header-text);}
  .brand-sub{font-family:'Nunito', sans-serif;font-weight:700;font-size:18px;color:var(--header-text);letter-spacing:.1px;margin-top:2px;}

  /* ---------- Filtros ---------- */
  .filters-bar{
    display:flex;align-items:center;gap:10px;padding:16px 20px 4px;
  }
  .filters{
    display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;
    scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{display:none;}
  .chip{
    font-family:var(--font-body);font-weight:600;font-size:14px;
    padding:9px 17px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--surface-2);color:var(--text-soft);cursor:pointer;white-space:nowrap;
    transition:all .15s ease;
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:var(--white);}
  .chip:hover:not(.active){border-color:var(--text-soft);}

  .sort-select{
    font-family:var(--font-body);font-weight:600;font-size:13px;
    padding:9px 30px 9px 14px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--surface-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="%235B6273"><path d="M5.5 7.5l4.5 4.5 4.5-4.5"/></svg>') no-repeat right 10px center/12px;
    color:var(--text-soft);cursor:pointer;flex-shrink:0;-webkit-appearance:none;appearance:none;
  }
  .sort-select:focus{outline:2px solid var(--accent);outline-offset:1px;}

  .clear-filters-btn{
    font-family:var(--font-body);font-weight:600;font-size:13px;
    padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);
    background:transparent;color:var(--text-soft);cursor:pointer;flex-shrink:0;white-space:nowrap;
    transition:all .15s ease;
  }
  .clear-filters-btn:hover{border-color:var(--text-soft);color:var(--text);}

  .search-wrap{padding:10px 20px 6px;}
  .search-wrap input{
    width:100%;padding:12px 15px;border-radius:10px;border:1.5px solid var(--line);
    font-family:var(--font-body);font-size:15px;background:var(--surface-2);color:var(--text);
  }
  .search-wrap input::placeholder{color:var(--text-soft);}
  .search-wrap input:focus{outline:2px solid var(--accent);outline-offset:1px;}

  /* ---------- Listado de productos ---------- */
  main{padding:8px 20px 120px;max-width:720px;margin:0 auto;}
  .cat-heading{
    font-family:var(--font-mono);font-size:12px;text-transform:uppercase;letter-spacing:1px;
    color:var(--text-soft);margin:22px 2px 8px;
  }
  ul.product-list{list-style:none;margin:0;padding:0;}
  .product-row{
    display:flex;align-items:center;gap:14px;
    padding:16px 4px;border-bottom:1px solid var(--line);
  }
  .product-photo{
    width:144px;height:144px;border-radius:10px;overflow:hidden;flex-shrink:0;
    background:var(--surface-2);border:1px solid var(--line);position:relative;
  }
  .product-photo img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;}
  .photo-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:27px;height:27px;border-radius:50%;border:none;
    background:rgba(10,12,18,.65);color:#fff;font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2;
  }
  .photo-nav:hover{background:rgba(10,12,18,.85);}
  .photo-nav-left{left:3px;}
  .photo-nav-right{right:3px;}

  /* ---------- Visor de imagen ampliada ---------- */
  .img-lightbox{
    position:fixed;inset:0;background:rgba(5,6,10,.92);z-index:80;
    display:none;align-items:center;justify-content:center;padding:24px;
  }
  .img-lightbox.open{display:flex;}
  .img-lightbox img{
    max-width:100%;max-height:82vh;border-radius:12px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .lightbox-close{
    position:fixed;top:20px;right:20px;
    width:44px;height:44px;border-radius:50%;border:none;
    background:var(--surface-2);color:var(--text);font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:81;
  }
  .lightbox-close:hover{background:var(--surface-3);}
  .lightbox-nav{
    position:fixed;top:50%;transform:translateY(-50%);
    width:50px;height:50px;border-radius:50%;border:none;
    background:var(--surface-2);color:var(--text);font-size:24px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:81;
  }
  .lightbox-nav:hover{background:var(--surface-3);}
  .lightbox-nav-left{left:16px;}
  .lightbox-nav-right{right:16px;}
  .product-info{flex:1;min-width:0;}
  .product-top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .product-name{font-family:var(--font-display);font-weight:600;font-size:17px;margin-bottom:4px;color:var(--text);}
  .product-price{font-family:var(--font-mono);font-size:14px;color:var(--text-soft);}

  .option-row{margin-top:10px;}
  .variant-row{display:flex;gap:6px;flex-wrap:wrap;}
  .variant-btn{
    font-family:var(--font-body);font-weight:700;font-size:12.5px;
    padding:6px 13px;border-radius:999px;border:1.5px solid;
    background:transparent;cursor:pointer;letter-spacing:.2px;
    transition:all .15s ease;
  }

  .stepper{
    display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex-shrink:0;
  }
  .stepper button{
    width:38px;height:38px;border:none;background:var(--surface-2);color:var(--text);
    font-size:20px;cursor:pointer;font-family:var(--font-mono);
  }
  .stepper button:hover{background:var(--surface-3);}
  .stepper input{
    width:38px;text-align:center;border:none;border-left:1.5px solid var(--line);border-right:1.5px solid var(--line);
    font-family:var(--font-mono);font-size:15px;padding:8px 0;background:var(--surface-2);color:var(--text);
  }
  .empty-state{
    text-align:center;padding:60px 20px;color:var(--text-soft);font-family:var(--font-body);font-size:14px;
  }

  /* ---------- Paginación ---------- */
  .pagination{
    display:flex;align-items:center;justify-content:center;gap:14px;padding:26px 4px 10px;
  }
  .page-btn{
    font-family:var(--font-body);font-weight:600;font-size:13px;
    padding:9px 16px;border-radius:9px;border:1.5px solid var(--line);
    background:var(--surface-2);color:var(--text);cursor:pointer;
  }
  .page-btn:disabled{opacity:.4;cursor:not-allowed;}
  .page-indicator{font-family:var(--font-mono);font-size:12px;color:var(--text-soft);}

  /* ---------- Botón flotante de carrito ---------- */
  .cart-fab{
    position:fixed;bottom:20px;right:20px;
    background:var(--accent);color:var(--white);
    border:none;border-radius:999px;padding:14px 22px;
    font-family:var(--font-body);font-weight:700;font-size:14px;
    display:flex;align-items:center;gap:9px;cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:30;
    transition:transform .15s ease;
  }
  .cart-fab:hover{transform:translateY(-2px);}
  .cart-fab .count{
    background:rgba(0,0,0,.28);border-radius:999px;padding:2px 9px;font-family:var(--font-mono);font-size:12px;
  }

  /* ---------- Botón ir arriba ---------- */
  .top-fab{
    position:fixed;bottom:20px;left:20px;
    background:var(--surface-2);color:var(--text);
    border:1.5px solid var(--line);border-radius:999px;
    width:46px;height:46px;display:flex;align-items:center;justify-content:center;
    font-size:18px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:30;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
  }
  .top-fab.show{opacity:1;pointer-events:auto;}
  .top-fab:hover{transform:translateY(-2px);}

  /* ---------- Carrito (modal) ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;
    display:none;align-items:flex-end;justify-content:center;
  }
  .overlay.open{display:flex;}
  .cart-panel{
    background:var(--surface);width:100%;max-width:520px;max-height:88vh;
    border-radius:20px 20px 0 0;overflow-y:auto;padding:22px 20px 26px;
    animation:slideup .22s ease;border-top:1px solid var(--line);
  }
  @media (min-width:640px){
    .overlay{align-items:center;}
    .cart-panel{border-radius:18px;max-height:82vh;border:1px solid var(--line);}
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .cart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .cart-header h2{font-family:var(--font-display);font-size:22px;margin:0;color:var(--text);}
  .close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-soft);line-height:1;}
  .cart-note{font-size:12.5px;color:var(--text-soft);margin:0 0 14px;}

  /* Recibo estilo ticket */
  .receipt{
    background:var(--surface-2);border-radius:10px;padding:18px 16px;
    font-family:var(--font-mono);font-size:14px;color:var(--text);
    border:1px dashed var(--text-soft);
  }
  .receipt-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line);}
  .receipt-line:last-of-type{border-bottom:none;}
  .receipt-line .rl-name{flex:1;}
  .receipt-remove{
    background:var(--danger);border:none;color:var(--white);cursor:pointer;margin-left:8px;
    width:19px;height:19px;border-radius:50%;font-size:11px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;
  }
  .receipt-remove:hover{background:#C43D31;}
  .receipt-total{
    display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;
    border-top:2px solid var(--text);font-weight:700;font-size:14px;
  }
  .cart-empty{padding:40px 10px;text-align:center;color:var(--text-soft);font-size:14px;}

  .cart-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .btn{
    font-family:var(--font-body);font-weight:700;font-size:14px;padding:13px 16px;
    border-radius:10px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary{background:var(--ok);color:var(--white);}
  .btn-secondary{background:var(--surface-2);color:var(--text);border:1.5px solid var(--line);}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .toast{
    position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
    background:var(--header-bg);color:var(--header-text);padding:10px 18px;border-radius:999px;
    font-size:13px;font-family:var(--font-body);z-index:60;opacity:0;transition:opacity .25s ease;pointer-events:none;
    border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 20px rgba(0,0,0,.15);
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo-wrap" id="logoWrap"></div>
  <div>
    <div class="brand-name" id="brandName">Mi Empresa</div>
    <div class="brand-sub">Catálogo de productos</div>
  </div>
</header>

<div class="search-wrap">
  <input type="text" id="searchInput" placeholder="Buscar producto...">
</div>
<div class="filters-bar">
  <div class="filters" id="filters"></div>
  <select class="sort-select" id="sortSelect">
    <option value="none">Ordenar</option>
    <option value="asc">Precio: menor a mayor</option>
    <option value="desc">Precio: mayor a menor</option>
  </select>
  <button class="clear-filters-btn" id="clearFiltersBtn" title="Limpiar filtros">✕ Limpiar filtros</button>
</div>

<main>
  <div id="productContainer"></div>
  <div class="pagination" id="pagination"></div>
</main>

<button class="cart-fab" id="cartFab">
  🛒 Ver carrito <span class="count" id="cartCount">0</span>
</button>
<button class="top-fab" id="topFab" title="Ir arriba">↑</button>

<div class="overlay" id="overlay">
  <div class="cart-panel">
    <div class="cart-header">
      <h2>Tu pedido</h2>
      <button class="close-btn" id="closeCart">✕</button>
    </div>
    <p class="cart-note">Este catálogo es solo de referencia. Envía tu listado para cotizar o confirmar tu pedido. Cotizamos envíos a todo México y contamos con diferentes formas de pago.</p>
    <button class="btn btn-secondary" id="btnClearCart" style="display:none;margin-bottom:14px;">🗑️ Vaciar carrito</button>
    <div id="cartBody"></div>
    <div class="cart-actions" id="cartActions" style="display:none;">
      <button class="btn btn-secondary" id="btnCopyText">📋 Copiar como texto</button>
      <button class="btn btn-primary" id="btnWhatsapp">📲 Enviar por WhatsApp</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="img-lightbox" id="imgLightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <button class="lightbox-nav lightbox-nav-left" id="lightboxPrev" aria-label="Foto anterior">‹</button>
  <img id="lightboxImg" src="" alt="Producto ampliado">
  <button class="lightbox-nav lightbox-nav-right" id="lightboxNext" aria-label="Foto siguiente">›</button>
</div>

<script>
/* ======================================================================
   CONFIGURA AQUÍ TU CATÁLOGO
   Cambia estos valores por los de tu empresa. No necesitas tocar nada
   más abajo de esta sección para personalizar el catálogo.
====================================================================== */

// Genera una imagen de marcador (placeholder) mientras no tengas fotos reales.
// Se usa automáticamente en los productos que todavía no tienen "image" propia.
function placeholder(letter, hex){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="14" fill="${hex}"/>
    <text x="50" y="60" font-family="Inter, sans-serif" font-size="38" font-weight="700"
      text-anchor="middle" fill="#ffffff">${letter}</text>
  </svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

/* ====================================================================== */

let cart = {};              // { cartKey: qty }
let activeFilter = "Todos";
let searchTerm = "";
let activeVariant = {};     // { productId: variantIndex }
let photoIndex = {};        // { "productId_variantIndex": currentPhotoIndex }
let currentPage = 1;
let lightboxProduct = null;
let sortMode = "none"; // "none" | "asc" | "desc"

function money(n){ return "$" + n.toFixed(2); }

function initHeader(){
  const logoWrap = document.getElementById("logoWrap");
  const brandNameEl = document.getElementById("brandName");
  if (CONFIG.logoUrl) {
    // El logo ya incluye el nombre de la marca, así que ocultamos el texto duplicado.
    logoWrap.innerHTML = `<img src="${CONFIG.logoUrl}" alt="${CONFIG.brandName}">`;
    brandNameEl.style.display = "none";
  } else {
    logoWrap.textContent = CONFIG.brandName.trim().charAt(0).toUpperCase() || "L";
    brandNameEl.textContent = CONFIG.brandName;
    brandNameEl.style.display = "block";
  }
}

function categoriesWithStock(){
  const present = [...new Set(CONFIG.products.map(p => p.category))];
  return present.sort((a, b) => a.localeCompare(b, "es"));
}

function initFilters(){
  const wrap = document.getElementById("filters");
  const allCats = ["Todos", ...categoriesWithStock()];
  wrap.innerHTML = allCats.map(cat =>
    `<button class="chip ${cat === activeFilter ? "active" : ""}" data-cat="${cat}">${cat}</button>`
  ).join("");
  wrap.querySelectorAll(".chip").forEach(chip => {
    chip.addEventListener("click", () => {
      activeFilter = chip.dataset.cat;
      currentPage = 1;
      initFilters();
      renderProducts();
    });
  });
}

function getVariantIndex(productId){
  return activeVariant[productId] || 0;
}

function cartKey(product){
  if (!product.variants) return String(product.id);
  const vi = getVariantIndex(product.id);
  return `${product.id}|${product.variants[vi].label}`;
}

function currentImages(product){
  if (product.variants) return product.variants[getVariantIndex(product.id)].images;
  return product.images;
}

function photoKey(product){
  const vi = product.variants ? getVariantIndex(product.id) : 0;
  return `${product.id}_${vi}`;
}

function currentImage(product){
  const imgs = currentImages(product);
  const key = photoKey(product);
  const idx = (photoIndex[key] || 0) % imgs.length;
  return imgs[idx];
}

function navPhoto(product, dir){
  const imgs = currentImages(product);
  const key = photoKey(product);
  const idx = photoIndex[key] || 0;
  photoIndex[key] = (idx + dir + imgs.length) % imgs.length;
}

function updatePhotoDisplays(product){
  const src = currentImage(product);
  const thumbImg = document.querySelector(`.product-photo[data-pid="${product.id}"] img`);
  if (thumbImg) thumbImg.src = src;
  if (lightboxProduct && lightboxProduct.id === product.id) {
    document.getElementById("lightboxImg").src = src;
  }
}

function filteredProducts(){
  let items = CONFIG.products.filter(p => {
    const matchesCat = activeFilter === "Todos" || p.category === activeFilter;
    const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase());
    return matchesCat && matchesSearch;
  });

  if (sortMode === "asc") {
    items = [...items].sort((a, b) => a.price - b.price);
  } else if (sortMode === "desc") {
    items = [...items].sort((a, b) => b.price - a.price);
  } else {
    items = [...items].sort((a, b) => {
      const catCompare = a.category.localeCompare(b.category, "es");
      if (catCompare !== 0) return catCompare;
      return a.name.localeCompare(b.name, "es");
    });
  }
  return items;
}

function renderProducts(){
  const container = document.getElementById("productContainer");
  const pager = document.getElementById("pagination");
  let items = filteredProducts();

  if (items.length === 0) {
    container.innerHTML = `<div class="empty-state">No hay productos disponibles.</div>`;
    pager.innerHTML = "";
    return;
  }

  const totalPages = Math.max(1, Math.ceil(items.length / CONFIG.pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * CONFIG.pageSize;
  const pageItems = items.slice(start, start + CONFIG.pageSize);

  // Agrupar por categoría solo para el encabezado visual (dentro de la página actual).
  // Si hay un orden por precio activo, se muestra todo en una sola lista continua (sin divisiones).
  const grouped = {};
  const showCategoryHeadings = activeFilter === "Todos" && sortMode === "none";
  if (sortMode === "none") {
    pageItems.forEach(p => {
      grouped[p.category] = grouped[p.category] || [];
      grouped[p.category].push(p);
    });
  } else {
    grouped["__flat__"] = pageItems;
  }

  let html = "";
  Object.keys(grouped).forEach(cat => {
    if (showCategoryHeadings) html += `<div class="cat-heading">${cat}</div>`;
    html += `<ul class="product-list">`;
    grouped[cat].forEach(p => {
      const key = cartKey(p);
      const qty = cart[key] || 0;
      const img = currentImage(p);
      html += `
        <li class="product-row" data-pid="${p.id}">
          <div class="product-photo" data-pid="${p.id}">
            <button class="photo-nav photo-nav-left" data-nav="-1" data-pid="${p.id}" aria-label="Foto anterior">‹</button>
            <img src="${img}" alt="${p.name}">
            <button class="photo-nav photo-nav-right" data-nav="1" data-pid="${p.id}" aria-label="Foto siguiente">›</button>
          </div>
          <div class="product-info">
            <div class="product-top-row">
              <div>
                <div class="product-name">${p.name}</div>
                <div class="product-price">${money(p.price)} / ${p.unit.toUpperCase()}</div>
              </div>
            </div>
            <div class="option-row">
              ${p.variants ? `<div class="variant-row" data-variant-for="${p.id}">
                ${p.variants.map((v, i) => `
                  <button class="variant-btn"
                    data-vid="${p.id}" data-vi="${i}"
                    style="border-color:${v.color}; color:${i === getVariantIndex(p.id) ? '#fff' : v.color}; background:${i === getVariantIndex(p.id) ? v.color : '#fff'};">
                    ${v.label}
                  </button>`).join("")}
              </div>` : ``}
            </div>
          </div>
          <div class="stepper">
            <button data-action="dec" data-key="${key}">−</button>
            <input type="text" readonly value="${qty}" data-qty-key="${key}">
            <button data-action="inc" data-key="${key}">+</button>
          </div>
        </li>`;
    });
    html += `</ul>`;
  });
  container.innerHTML = html;

  // Botones de variante
  container.querySelectorAll(".variant-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const pid = Number(btn.dataset.vid);
      const vi = Number(btn.dataset.vi);
      activeVariant[pid] = vi;
      renderProducts();
    });
  });

  // Steppers
  container.querySelectorAll("button[data-action]").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.key;
      const action = btn.dataset.action;
      const current = cart[key] || 0;
      const next = action === "inc" ? current + 1 : Math.max(0, current - 1);
      if (next === 0) delete cart[key]; else cart[key] = next;
      updateCartCount();
      const input = container.querySelector(`input[data-qty-key="${key}"]`);
      if (input) input.value = next;
    });
  });

  renderPagination(totalPages);

  // Flechas para cambiar de foto (izquierda/derecha, cíclico)
  container.querySelectorAll(".photo-nav").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const pid = Number(btn.dataset.pid);
      const dir = Number(btn.dataset.nav);
      const product = CONFIG.products.find(pr => pr.id === pid);
      navPhoto(product, dir);
      updatePhotoDisplays(product);
    });
  });

  // Foto ampliada al hacer clic en la imagen
  container.querySelectorAll(".product-photo img").forEach(img => {
    img.addEventListener("click", () => {
      const pid = Number(img.closest(".product-photo").dataset.pid);
      const product = CONFIG.products.find(pr => pr.id === pid);
      openLightbox(product);
    });
  });
}

function openLightbox(product){
  lightboxProduct = product;
  document.getElementById("lightboxImg").src = currentImage(product);
  document.getElementById("imgLightbox").classList.add("open");
}
function closeLightbox(){
  document.getElementById("imgLightbox").classList.remove("open");
  lightboxProduct = null;
}

function renderPagination(totalPages){
  const pager = document.getElementById("pagination");
  if (totalPages <= 1) { pager.innerHTML = ""; return; }
  pager.innerHTML = `
    <button class="page-btn" id="prevPage" ${currentPage === 1 ? "disabled" : ""}>← Anterior</button>
    <span class="page-indicator">Página ${currentPage} de ${totalPages}</span>
    <button class="page-btn" id="nextPage" ${currentPage === totalPages ? "disabled" : ""}>Siguiente →</button>
  `;
  const prev = document.getElementById("prevPage");
  const next = document.getElementById("nextPage");
  if (prev) prev.addEventListener("click", () => { currentPage--; renderProducts(); window.scrollTo({top:0, behavior:"smooth"}); });
  if (next) next.addEventListener("click", () => { currentPage++; renderProducts(); window.scrollTo({top:0, behavior:"smooth"}); });
}

function updateCartCount(){
  const totalItems = Object.values(cart).reduce((a,b) => a+b, 0);
  document.getElementById("cartCount").textContent = totalItems;
}

function describeCartLine(key){
  const [pidStr, variantLabel] = key.split("|");
  const p = CONFIG.products.find(pr => pr.id === Number(pidStr));
  const name = variantLabel ? `${p.name} (${variantLabel})` : p.name;
  return { product: p, name };
}

function cartLines(){
  return Object.entries(cart).map(([key, qty]) => {
    const { product, name } = describeCartLine(key);
    return { key, name, qty, price: product.price, subtotal: product.price * qty };
  });
}

function renderCart(){
  const body = document.getElementById("cartBody");
  const actions = document.getElementById("cartActions");
  const clearBtn = document.getElementById("btnClearCart");
  const lines = cartLines();

  if (lines.length === 0) {
    body.innerHTML = `<div class="cart-empty">Tu carrito está vacío.<br>Agrega productos desde el catálogo.</div>`;
    actions.style.display = "none";
    clearBtn.style.display = "none";
    return;
  }
  actions.style.display = "flex";
  clearBtn.style.display = "flex";

  const total = lines.reduce((a, l) => a + l.subtotal, 0);
  let html = `<div class="receipt">`;
  lines.forEach(l => {
    html += `
      <div class="receipt-line">
        <span class="rl-name">${l.qty} × ${l.name}</span>
        <span>${money(l.subtotal)}
          <button class="receipt-remove" data-remove="${l.key}" title="Eliminar">✕</button>
        </span>
      </div>`;
  });
  html += `<div class="receipt-total"><span>Total</span><span>${money(total)}</span></div></div>`;
  body.innerHTML = html;

  body.querySelectorAll("[data-remove]").forEach(btn => {
    btn.addEventListener("click", () => {
      delete cart[btn.dataset.remove];
      updateCartCount();
      renderCart();
      renderProducts();
    });
  });
}

function buildListText(){
  const lines = cartLines();
  const total = lines.reduce((a,l) => a + l.subtotal, 0);
  let text = `Hola, quisiera cotizar un pedido con los siguientes productos:\n\n`;
  text += `Pedido — ${CONFIG.brandName}\n`;
  text += `--------------------------------\n`;
  lines.forEach(l => {
    text += `${l.qty} x ${l.name} — ${money(l.subtotal)}\n`;
  });
  text += `--------------------------------\n`;
  text += `Total: ${money(total)}`;
  return text;
}

function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2200);
}

/* ---------- Eventos generales ---------- */
document.getElementById("searchInput").addEventListener("input", (e) => {
  searchTerm = e.target.value;
  currentPage = 1;
  renderProducts();
});

document.getElementById("sortSelect").addEventListener("change", (e) => {
  sortMode = e.target.value;
  currentPage = 1;
  renderProducts();
});

document.getElementById("clearFiltersBtn").addEventListener("click", () => {
  activeFilter = "Todos";
  searchTerm = "";
  sortMode = "none";
  currentPage = 1;
  document.getElementById("searchInput").value = "";
  document.getElementById("sortSelect").value = "none";
  initFilters();
  renderProducts();
});

document.getElementById("cartFab").addEventListener("click", () => {
  renderCart();
  document.getElementById("overlay").classList.add("open");
});
document.getElementById("closeCart").addEventListener("click", () => {
  document.getElementById("overlay").classList.remove("open");
});
document.getElementById("overlay").addEventListener("click", (e) => {
  if (e.target.id === "overlay") document.getElementById("overlay").classList.remove("open");
});

function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast("Listado copiado ✅"))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
    showToast("Listado copiado ✅");
  } catch (err) {
    showToast("No se pudo copiar, selecciona el texto manualmente");
  }
  document.body.removeChild(ta);
}

document.getElementById("btnCopyText").addEventListener("click", () => {
  if (Object.keys(cart).length === 0) return;
  copyText(buildListText());
});

let clearConfirmPending = false;
document.getElementById("btnClearCart").addEventListener("click", () => {
  if (Object.keys(cart).length === 0) return;
  const btn = document.getElementById("btnClearCart");
  if (!clearConfirmPending) {
    clearConfirmPending = true;
    btn.textContent = "¿Seguro? Toca de nuevo para vaciar";
    setTimeout(() => {
      clearConfirmPending = false;
      btn.textContent = "🗑️ Vaciar carrito";
    }, 3000);
    return;
  }
  clearConfirmPending = false;
  btn.textContent = "🗑️ Vaciar carrito";
  cart = {};
  updateCartCount();
  renderCart();
  renderProducts();
  showToast("Carrito vacío");
});

document.getElementById("btnWhatsapp").addEventListener("click", () => {
  if (Object.keys(cart).length === 0) return;
  const text = buildListText();
  const url = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(text)}`;
  window.open(url, "_blank");
});

document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
document.getElementById("imgLightbox").addEventListener("click", (e) => {
  if (e.target.id === "imgLightbox") closeLightbox();
});
document.getElementById("lightboxPrev").addEventListener("click", () => {
  if (!lightboxProduct) return;
  navPhoto(lightboxProduct, -1);
  updatePhotoDisplays(lightboxProduct);
});
document.getElementById("lightboxNext").addEventListener("click", () => {
  if (!lightboxProduct) return;
  navPhoto(lightboxProduct, 1);
  updatePhotoDisplays(lightboxProduct);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeLightbox();
  if (lightboxProduct && e.key === "ArrowLeft") { navPhoto(lightboxProduct, -1); updatePhotoDisplays(lightboxProduct); }
  if (lightboxProduct && e.key === "ArrowRight") { navPhoto(lightboxProduct, 1); updatePhotoDisplays(lightboxProduct); }
});

/* ---------- Botón ir arriba ---------- */
const topFab = document.getElementById("topFab");
window.addEventListener("scroll", () => {
  if (window.scrollY > 420) topFab.classList.add("show");
  else topFab.classList.remove("show");
});
topFab.addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));

/* ---------- Inicio ---------- */
initHeader();
initFilters();
renderProducts();
updateCartCount();
</script>
</body>
</html>
